steps:
  # 1. Build Docker image with BuildKit and remote layer cache
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai:latest || true
        COMMIT_VAL="$SHORT_SHA"
        if [ -z "$$COMMIT_VAL" ] || [ "$$COMMIT_VAL" = "dev" ]; then
          COMMIT_VAL="${COMMIT_SHA:-production}"
        fi
        BRANCH_VAL="$BRANCH_NAME"
        if [ -z "$$BRANCH_VAL" ]; then
          BRANCH_VAL="main"
        fi
        APP_VERSION_VAL="$TAG_NAME"
        if [ -z "$$APP_VERSION_VAL" ]; then
          APP_VERSION_VAL=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
        else
          APP_VERSION_VAL="${APP_VERSION_VAL#v}"
        fi
        docker build \
          --cache-from europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg COMMIT_SHA=$$COMMIT_VAL \
          --build-arg BRANCH_NAME=$$BRANCH_VAL \
          --build-arg APP_VERSION=$$APP_VERSION_VAL \
          -t europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai:$COMMIT_SHA \
          -t europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai:latest \
          .
    env:
      - 'DOCKER_BUILDKIT=1'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai'

  # 3. Ensure Cloud Storage bucket for database persistence exists
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        BUCKET_NAME="shelv-ai-db-$PROJECT_ID"
        if ! gcloud storage buckets describe "gs://$$BUCKET_NAME" >/dev/null 2>&1; then
          echo "Creating GCS bucket $$BUCKET_NAME..."
          gcloud storage buckets create "gs://$$BUCKET_NAME" --location=europe-west1 --uniform-bucket-level-access
        else
          echo "GCS bucket $$BUCKET_NAME already exists."
        fi

  # 4. Deploy to Cloud Run with cheapest cost-optimized configuration:
  #    - min-instances=0 (scales to 0 when idle = $0 cost)
  #    - max-instances=2 (caps maximum spend)
  #    - memory=512Mi (Cloud Run free tier eligible)
  #    - cpu=1
  #    - concurrency=80 (handles multiple users per container)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shelv-ai'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'GCS_BUCKET_NAME=shelv-ai-db-$PROJECT_ID,COMMIT_SHA=$SHORT_SHA,BRANCH_NAME=$BRANCH_NAME'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/shelv-ai-repo/shelv-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
