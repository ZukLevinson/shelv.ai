<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>shelv.ai Scanner</title>
    <link rel="manifest" href="/scanner/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/scanner/favicon.svg" />
    <link rel="apple-touch-icon" href="/scanner/favicon.svg" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="shelv.ai" />
    <!-- The `react-native-web` recommended style reset + Safari WebKit compatibility fixes -->
    <style id="expo-reset">
      /* These styles make the body full-height across Safari / WebKit and Android */
      html,
      body {
        height: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        width: 100%;
        background-color: #090d16;
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: 100%;
      }
      /* Ensure proper container stretching and scrolling behavior */
      body {
        overflow-x: hidden;
      }
      /* These styles make the root element full-height on iOS Safari */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        width: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
